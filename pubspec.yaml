name: transit_pro
description: "Student Transport Management App - Safe Journeys, Happy Kids, Peace of Mind"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  geolocator: ^13.0.0
  flutter_local_notifications: ^18.0.0
  flutter_polyline_points: ^2.1.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_database: ^12.1.0
  google_sign_in: 6.2.1
  mapbox_maps_flutter: ^2.28.3

  # Shared domain layer — models, enums and config used by BOTH this app and
  # the admin app. See ../../transit_core.
  transit_core:
    path: ../../transit_core
dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/navbar/
    - assets/images/profile/
    - assets/images/profile_page/
    - assets/images/role_selection/
    - assets/images/schedule/
    - assets/images/splash_screen/
    - assets/images/splash_screen/bus_splash_icon.png
    - assets/images/stats/
    - assets/images/utilities/
    - assets/images/
    - assets/images/notification_bell.gif
    - assets/images/path_transparent.gif
